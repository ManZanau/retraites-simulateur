# =============================================================================
# BASELINES LÉGISLATIFS — RÉGIME GÉNÉRAL
# Simulateur de dépenses publiques / volet retraites
# =============================================================================
#
# Trois scénarios de référence, à distinguer impérativement dans tout chiffrage.
# Un chiffrage de réforme qui ne précise pas son baseline mélange l'effet de la
# réforme testée avec l'effet du calendrier de suspension.
#
#   B0_reforme_2023   Droit issu de la réforme du 14 avril 2023, sans suspension.
#                     Contrefactuel. Ne correspond à aucun droit applicable
#                     aujourd'hui, mais sert de point de comparaison.
#
#   B1_suspension     Droit applicable aux pensions prenant effet du
#                     2026-09-01 au 2028-01-01. C'est le droit en vigueur.
#
#   B2_post_2028      Hypothèse conventionnelle de reprise du calendrier après
#                     la fin de la suspension. NON ÉCRIT DANS LA LOI : la LFSS
#                     2026 fixe le terme de la suspension mais pas les modalités
#                     de sortie. Paramètre de travail, à assumer comme tel.
#
# SOURCES
#   Loi n° 2025-1403 du 30 décembre 2025 (LFSS 2026), art. 105
#     -> nouvelle rédaction des art. L161-17-2 et L161-17-3 CSS
#   Décrets n° 2026-344 et n° 2026-345 du 7 mai 2026
#   Circulaire CNAV 2026-07 du 5 mars 2026
#   Loi n° 2023-270 du 14 avril 2023 (réforme "Borne")
#
# NIVEAU DE CONFIANCE
#   Les tables ci-dessous sont reconstituées à partir de sources secondaires
#   concordantes (CNAV, CNRACL, CNBF, presse spécialisée), non à partir du texte
#   réglementaire lui-même. À VÉRIFIER contre les décrets du 7 mai 2026 et la
#   circulaire CNAV avant tout usage en production. Voir `statut_verification`.
#
# CONVENTIONS
#   - Âges exprimés en mois révolus (62 ans 9 mois = 753).
#   - Durées exprimées en trimestres.
#   - Les générations à bornes infra-annuelles sont éclatées par trimestre
#     de naissance (clés `1965T1`, `1965T2+`).
#   - `defaut_au_dela` s'applique à toute génération postérieure à la dernière
#     clé explicite.
# =============================================================================

meta:
  version: "0.2.0"
  date_creation: "2026-08-19"
  date_verification: "2026-09-09"
  perimetre: "regime_general"
  statut_verification: >
    VERIFIE le 2026-09-09 contre le texte consolide sur Legifrance.
    B1_suspension reproduit mot pour mot les articles L. 161-17-2 CSS (age
    legal) et L. 161-17-3 CSS (duree d'assurance requise) dans leur redaction
    issue de l'article 105 de la loi n° 2025-1403 du 30 decembre 2025
    (LFSS 2026), en vigueur depuis le 31/12/2025, applicables aux pensions
    prenant effet a compter du 1er septembre 2026. La carriere longue
    "debut avant 20 ans" est completee depuis l'article D. 351-1-1 II CSS
    (version en vigueur depuis le 01/09/2026, modifiee par le decret
    n° 2026-345 du 7 mai 2026, art. 2).
    Les decrets n° 2026-344 et n° 2026-345 ne contiennent PAS la grille
    generale du regime general : 2026-345 traite la carriere longue, les
    assures handicapes et Mayotte ; 2026-344 traite la fonction publique
    (CNRACL et ouvriers de l'Etat). Voir autres_baremes_lies.
    B0_reforme_2023 est coherent avec le calendrier de la loi n° 2023-270 du
    14 avril 2023 ; il n'a pas ete recontrole ligne a ligne contre la version
    archivee de l'article (contrefactuel, priorite moindre).
  regimes_non_couverts:
    - fonction_publique_etat
    - fonction_publique_territoriale_hospitaliere
    - regimes_speciaux
    - non_salaries
  note_perimetre: >
    Ce fichier ne couvre que le régime général. La fonction publique de
    catégorie active suit une grille distincte (borne des 59 ans décalée de la
    génération 1973 à la génération 1974 par la suspension). Les régimes
    spéciaux et non-salariés ont leurs propres calendriers.

# -----------------------------------------------------------------------------
# Paramètres invariants — identiques dans les trois baselines
# -----------------------------------------------------------------------------
invariants:
  age_taux_plein_automatique_mois: 804   # 67 ans, toutes générations
  duree_assurance_cible_trimestres: 172  # plafond de la montée en charge
  note_taux_plein: >
    L'âge d'annulation de la décote est resté à 67 ans pour toutes les
    générations, y compris après la réforme 2023 et après la suspension.
    Attention : le taux plein automatique supprime la décote, pas la
    proratisation. Une carrière incomplète reste proratisée à 67 ans.

# =============================================================================
# B0 — RÉFORME 2023 SANS SUSPENSION (contrefactuel)
# =============================================================================
B0_reforme_2023:

  libelle: "Réforme du 14 avril 2023, calendrier initial"
  applicable: false
  note: >
    Montée en charge de 3 mois par génération à partir des assurés nés à
    compter du 1er septembre 1961, jusqu'à 64 ans pour la génération 1968.
    Durée d'assurance portée à 172 trimestres dès la génération 1965.
  reference_legale: >
    Art. L. 161-17-2 et L. 161-17-3 CSS dans leur rédaction issue de la loi
    n° 2023-270 du 14 avril 2023 (art. 10), ANTÉRIEURE à la LFSS 2026.
    Contrefactuel : ne correspond à aucun droit applicable depuis le
    01/09/2026. Valeurs cohérentes avec le calendrier publié de la réforme
    2023 ; non recontrôlées ligne à ligne contre la version archivée de
    l'article (priorité moindre — voir meta.statut_verification).

  age_legal_mois:
    # Générations antérieures : droit issu de la loi Touraine de 2014,
    # hors champ de modélisation fine. Valeur plancher, à ne pas utiliser
    # pour un chiffrage sur ces générations.
    defaut_en_deca: 744    # 62 ans
    1961T4: 747    # 62 ans 3 mois — nés à compter du 01/09/1961
    1962:   750    # 62 ans 6 mois
    1963:   753    # 62 ans 9 mois
    1964:   756    # 63 ans
    1965:   759    # 63 ans 3 mois
    1966:   762    # 63 ans 6 mois
    1967:   765    # 63 ans 9 mois
    1968:   768    # 64 ans
    defaut_au_dela: 768

  duree_assurance_trimestres:
    defaut_en_deca: 168    # loi Touraine, hors champ de modélisation fine
    1961T4: 169
    1962:   169
    1963:   170
    1964:   171
    1965:   172
    defaut_au_dela: 172

# =============================================================================
# B1 — DROIT EN VIGUEUR (suspension LFSS 2026)
# =============================================================================
B1_suspension:

  libelle: "Suspension LFSS 2026 — droit applicable"
  applicable: true
  date_effet: "2026-09-01"
  date_fin: "2028-01-01"
  note: >
    Gel du calendrier pour les générations 1964 à 1968. Les générations 1964 et
    T1 1965 restent à 62 ans 9 mois. La montée en charge reprend à compter des
    assurés nés au 1er avril 1965, pour atteindre 64 ans à la génération 1969.
    Les générations 1966 à 1968 gagnent 3 mois sur l'âge légal mais AUCUN
    trimestre sur la durée d'assurance requise.

  critere_application: >
    La règle dépend de la date d'entrée en jouissance de la pension, pas de la
    date de dépôt du dossier. Une pension prenant effet avant le 2026-09-01
    relève de B0, même pour une génération concernée par la suspension.

  reference_legale: >
    Âge légal : art. L. 161-17-2 CSS, rédaction issue de la loi n° 2025-1403
    du 30/12/2025 (LFSS 2026), art. 105 — en vigueur depuis le 31/12/2025,
    applicable aux pensions prenant effet à compter du 01/09/2026. Bornes :
    62 ans 3 mois pour les nés du 01/09/1961 au 31/12/1961 ; 62 ans 6 mois
    pour 1962 ; 62 ans 9 mois pour les nés du 01/01/1963 au 31/03/1965 ;
    63 ans pour les nés du 01/04/1965 au 31/12/1965 ; 63 ans 3 mois pour
    1966 ; 63 ans 6 mois pour 1967 ; 63 ans 9 mois pour 1968 ; 64 ans à
    compter du 01/01/1969.
    Durée d'assurance : art. L. 161-17-3 CSS, même loi et même entrée en
    vigueur. Bornes : 169 trimestres pour les nés du 01/09/1961 au
    31/12/1962 ; 170 pour les nés du 01/01/1963 au 31/03/1965 ; 171 pour les
    nés du 01/04/1965 au 31/12/1965 ; 172 à compter du 01/01/1966.
    Vérifié mot pour mot sur Légifrance le 2026-09-09.

  age_legal_mois:
    # Valeurs = art. L. 161-17-2 CSS (LFSS 2026). Vérifiées le 2026-09-09.
    defaut_en_deca: 744    # 62 ans — nés avant le 01/09/1961 : rédaction antérieure, hors champ
    1961T4: 747    # 62 ans 3 mois — en toute rigueur : nés du 01/09/1961 au 31/12/1961
    1962:   750    # 62 ans 6 mois
    1963:   753    # 62 ans 9 mois — borne légale 01/01/1963–31/03/1965
    1964:   753    # 62 ans 9 mois — même borne légale (B0 : 756)
    1965T1: 753    # 62 ans 9 mois — nés du 01/01/1965 au 31/03/1965 (B0 : 759)
    1965T2+: 756   # 63 ans — nés du 01/04/1965 au 31/12/1965
    1966:   759    # 63 ans 3 mois (B0 : 762)
    1967:   762    # 63 ans 6 mois (B0 : 765)
    1968:   765    # 63 ans 9 mois (B0 : 768)
    1969:   768    # 64 ans — à compter du 01/01/1969
    defaut_au_dela: 768

  duree_assurance_trimestres:
    # Valeurs = art. L. 161-17-3 CSS (LFSS 2026). Vérifiées le 2026-09-09.
    defaut_en_deca: 168    # nés avant le 01/09/1961 : hors champ
    1961T4: 169    # borne légale 01/09/1961–31/12/1962
    1962:   169
    1963:   170    # borne légale 01/01/1963–31/03/1965
    1964:   170    # même borne légale (B0 : 171)
    1965T1: 170    # nés du 01/01/1965 au 31/03/1965 (B0 : 172)
    1965T2+: 171   # nés du 01/04/1965 au 31/12/1965 (B0 : 172)
    1966:   172    # à compter du 01/01/1966 — aucun gain vs B0
    defaut_au_dela: 172

  carriere_longue:
    statut: "COMPLETE - verifie le 2026-09-09"
    reference: >
      Art. D. 351-1-1 CSS, version en vigueur depuis le 01/09/2026 (modifiee
      par le decret n° 2026-345 du 7 mai 2026, art. 2). Applicable aux
      pensions prenant effet a compter du 01/09/2026.
    bornes_de_base_mois:
      # D. 351-1-1 I CSS — age d'ouverture selon l'age de debut d'activite,
      # hors adaptations transitoires du II.
      debut_avant_16_ans: 696   # 58 ans
      debut_avant_18_ans: 720   # 60 ans
      debut_avant_20_ans: 744   # 62 ans
      debut_avant_21_ans: 756   # 63 ans
    note: >
      Seule la borne "debut avant 20 ans" fait l'objet d'un calendrier
      transitoire par generation (D. 351-1-1 II), pour les assures nes entre
      le 01/09/1961 et le 31/12/1970. Les bornes 16, 18 et 21 ans ne sont pas
      amenagees. Pour deux sous-periodes, le texte ne fixe pas un age en dur
      mais "l'age de l'article L. 161-17-2 minore de 2 ans et 6 mois" : la
      valeur ci-dessous est donc calculee a partir de la grille age_legal_mois
      ci-dessus.
    borne_avant_20_ans_mois:
      # Cle = periode de naissance. Valeurs en mois. Source : D. 351-1-1 II CSS.
      1961_09_a_1963_08: 720   # 60 ans — nes du 01/09/1961 au 31/08/1963
      1963_09_a_1963_12: 723   # 60 ans 3 mois — L.161-17-2 (753) moins 30 mois
      1964:              726   # 60 ans 6 mois
      1965_01_a_1965_11: 729   # 60 ans 9 mois
      1965_12:           728   # 60 ans 8 mois — sous-periode specifique du texte
      1966:              729   # 60 ans 9 mois — L.161-17-2 (759) moins 30 mois
      1967:              732   # 61 ans — (762) moins 30 mois
      1968:              735   # 61 ans 3 mois — (765) moins 30 mois
      1969:              738   # 61 ans 6 mois — (768) moins 30 mois
      1970:              741   # 61 ans 9 mois
      a_compter_de_1971: 744   # 62 ans — retour a la borne de base du I 3°
    handicap_duree_cotisee:
      # D. 351-1-5 CSS, modifie par le decret n° 2026-345 art. 2 (2°).
      note: >
        Pour les assures nes avant le 01/01/1973, la duree d'assurance cotisee
        exigee pour la retraite anticipee des travailleurs handicapes est
        celle de l'art. L. 161-17-3 CSS dans sa redaction ANTERIEURE a la loi
        du 14 avril 2023 (loi Touraine). Le I bis de D. 351-1-5 est abroge.
        Non chiffre ici : population faible, hors coeur du simulateur.

# =============================================================================
# B2 — POST-2028 (hypothèse conventionnelle)
# =============================================================================
B2_post_2028:

  libelle: "Sortie de suspension au 1er janvier 2028"
  applicable: false
  statut: "HYPOTHESE DE TRAVAIL - non écrite dans la loi"
  note: >
    La LFSS 2026 fixe le terme de la suspension au 2028-01-01 sans préciser les
    modalités de sortie. Trois trajectoires sont modélisées ci-dessous. Aucune
    n'est plus légitime que les autres : le choix relève de l'hypothèse
    politique, pas de la lecture juridique. Tout chiffrage à horizon 2028 et
    au-delà doit être produit sous les trois modes et présenté comme une
    fourchette, jamais sous un mode unique.

  mode_sortie: "retour_progressif"

  modes:

    # -- 1 -----------------------------------------------------------------
    retour_progressif:
      libelle: "Le calendrier décalé se poursuit tel quel"
      herite_de: "B1_suspension"
      lecture: "littérale"
      note: >
        Lecture littérale de la LFSS 2026 : la suspension n'a jamais arrêté la
        montée en charge, elle l'a décalée d'une génération. La grille B1
        converge d'elle-même vers 64 ans à la génération 1969, soit après la
        fin de la suspension. Rien ne se produit au 2028-01-01 : la trajectoire
        se poursuit sans rupture.
      continuite: true

    # -- 2 -----------------------------------------------------------------
    rattrapage_abrupt:
      libelle: "Retour immédiat au calendrier de la réforme 2023"
      herite_de: "B0_reforme_2023"
      lecture: "restrictive"
      note: >
        La suspension est traitée comme une parenthèse close : à compter du
        2028-01-01, la grille de 2023 s'applique à toute pension prenant effet.
        Les générations 1966 à 1968 n'ayant pas encore liquidé perdent le
        bénéfice du décalage.
      continuite: false
      discontinuite: >
        ATTENTION - ce mode crée une rupture au 2028-01-01. Un assuré né en 1966
        liquidant en décembre 2027 relève de 63 ans 3 mois ; le même liquidant en
        janvier 2028 relève de 63 ans 6 mois. Effet de bord attendu : forte
        concentration des liquidations sur le dernier trimestre 2027, à modéliser
        explicitement dans le module de comportement de départ, faute de quoi le
        chiffrage sous-estimera les dépenses de 2027 et surestimera celles de 2028.

    # -- 3 -----------------------------------------------------------------
    gel_perenne:
      libelle: "Le gel devient permanent"
      lecture: "extensive"
      note: >
        La montée en charge ne reprend jamais. L'âge légal reste à 62 ans et
        9 mois et la durée requise à 170 trimestres pour toutes les générations
        à compter de 1964. Correspond à une abrogation de fait de la réforme de
        2023, sans abrogation formelle. C'est le scénario le plus coûteux des
        trois, et celui qui porte l'écart le plus large avec B0.
      continuite: true
      age_legal_mois:
        defaut_en_deca: 744
        1961T4: 747
        1962:   750
        1963:   753
        1964:   753    # 62 ans 9 mois, définitivement
        defaut_au_dela: 753
      duree_assurance_trimestres:
        defaut_en_deca: 168
        1961T4: 169
        1962:   169
        1963:   170
        1964:   170    # 170 trimestres, définitivement
        defaut_au_dela: 170

# =============================================================================
# POINTS DE CONTRÔLE
# Assertions à faire vérifier automatiquement par la suite de tests.
# =============================================================================
controles:
  - id: "convergence_64_ans"
    description: "Les trois baselines convergent à 64 ans pour les générations tardives"
    attendu: "B0[1975] == B1[1975] == 768"
  - id: "gain_suspension_1964"
    description: "La génération 1964 gagne un trimestre d'âge légal"
    attendu: "B0[1964] - B1[1964] == 3"
  - id: "gain_suspension_1966_1968"
    description: "Les générations 1966-1968 gagnent 3 mois d'âge et 0 trimestre de durée"
    attendu: "B0.age[g] - B1.age[g] == 3 et B0.duree[g] == B1.duree[g] pour g in 1966..1968"
  - id: "neutralite_generations_anterieures"
    description: "Aucun effet de la suspension avant la génération 1964"
    attendu: "B0[g] == B1[g] pour g <= 1963"
  - id: "modes_B2_ordonnes"
    description: "Les trois modes de sortie s'ordonnent : gel <= progressif <= rattrapage"
    attendu: "gel_perenne[g] <= retour_progressif[g] <= rattrapage_abrupt[g] pour tout g"
  - id: "rattrapage_egale_B0"
    description: "Le mode rattrapage_abrupt restitue exactement la grille B0"
    attendu: "B2[rattrapage_abrupt][g] == B0[g] pour tout g"
  - id: "monotonie"
    description: "L'âge légal est croissant avec la génération dans chaque baseline"
    attendu: "age_legal non décroissant"
  - id: "plafond_duree"
    description: "La durée requise ne dépasse jamais 172 trimestres"
    attendu: "max(duree) == 172"

# =============================================================================
# AUTRES BARÈMES LIÉS — hors régime général, pour mémoire
# Non utilisés par le simulateur (périmètre = régime général). Documentés ici
# parce que les sources secondaires les confondent régulièrement avec la
# grille générale.
# =============================================================================
autres_baremes_lies:

  mayotte_age_legal:
    reference: >
      Décret n° 2003-589 du 1er juillet 2003, art. 2, 9° à 14°, dans leur
      rédaction issue du décret n° 2026-345 du 7 mai 2026, art. 3.
      Applicable aux pensions prenant effet à compter du 01/09/2026.
    note: >
      C'est la grille de l'ÂGE LÉGAL À MAYOTTE, PAS celle du régime général.
      Le décret n° 2026-345 art. 3 la donne sous forme de tableau propre, ce
      qui la rend facile à prendre à tort pour un barème "carrière longue" ou
      "régime général". Elle ne l'est pas.
    age_legal_mois:
      1963_01_a_1965_06: 750   # 62 ans 6 mois
      1965_07_a_1965_12: 753   # 62 ans 9 mois
      1966: 756                # 63 ans
      1967: 759                # 63 ans 3 mois
      1968: 762                # 63 ans 6 mois
      1969: 765                # 63 ans 9 mois

  fonction_publique:
    reference: >
      Décret n° 2026-344 du 7 mai 2026 (CNRACL et ouvriers de l'État),
      modifiant les décrets n° 2003-1306, n° 2004-1056 et n° 2023-435 ;
      art. D. 16-1 du code des pensions civiles et militaires de retraite
      (fonction publique de l'État, catégorie sédentaire) modifié par le
      décret n° 2026-345 art. 1.
    note: >
      La catégorie sédentaire suit l'âge légal de droit commun (L. 161-17-2).
      Pour les catégories active et super-active, le décret n° 2026-344
      décale d'une génération l'âge d'application du coefficient de
      majoration : catégorie active, borne des 59 ans repoussée de la
      génération 1973 à la génération 1974 ; super-active, borne des 54 ans
      de 1978 à 1979. Durée d'assurance requise pour la catégorie active :
      montée par paliers, 169 trim. pour les nés du 01/09/1966 au 31/12/1967,
      170 pour 01/01/1968–31/03/1970, 171 pour 01/04/1970–31/12/1970, 172 à
      compter du 01/01/1971. Non modélisé (hors périmètre régime général).
